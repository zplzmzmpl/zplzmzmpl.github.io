<html lang="zh-CN">

</head>
<body>

  <!-- ====== Header ====== -->
  <header class="site-header">
    <h1>Zhang Shiquan</h1>
    <p class="subtitle">Remote Sensing Science &amp; Technology</p>
    <p class="tagline">Observe our earth through satellite images, caring for our planet together</p>

    <nav class="social-links" aria-label="社交链接">
      <a href="https://github.com/zplzmzmpl" target="_blank" title="GitHub">
        <i class="fa-brands fa-github"></i>
      </a>
      <a href="mailto:3110837313@qq.com" title="Email: 3110837313@qq.com">
        <i class="fa-brands fa-qq"></i>
      </a>
      <a href="javascript:void(0)" title="WeChat ID: opppmqqqo">
        <i class="fa-brands fa-weixin"></i>
      </a>
    </nav>
  </header>

  <div class="divider"></div>

  <!-- ====== Projects ====== -->
  <section aria-label="项目列表">
    <h2 class="section-title">Projects</h2>
    <div class="projects-grid" id="projects-grid"></div>
  </section>

  <!-- ====== Footer ====== -->
  <footer class="site-footer">
    &copy; Zhang Shiquan &middot; Powered by GitHub Pages
  </footer>

  <!-- ====== Scripts ====== -->
  <script src="projects.js"></script>
  <script>
    (function () {
      const grid = document.getElementById('projects-grid');

      projects.forEach(function (p) {
        const card = document.createElement('div');
        card.className = 'project-card';

        // 标签 HTML
        const tagsHtml = (p.tags || []).map(function (t) {
          return '<span class="card-tag">' + t + '</span>';
        }).join('');

        card.innerHTML =
          '<a href="' + p.url + '" target="_blank" rel="noopener">' +
            '<img class="card-img" src="' + p.img + '" alt="' + (p.title || '') + '" loading="lazy">' +
            '<div class="card-body">' +
              '<div class="card-title">' + (p.title || '') + '</div>' +
              '<div class="card-descr">' + (p.descr || '') + '</div>' +
              (tagsHtml ? '<div class="card-tags">' + tagsHtml + '</div>' : '') +
            '</div>' +
          '</a>';

        grid.appendChild(card);
      });
    })();
  </script>
</body>
</html>
